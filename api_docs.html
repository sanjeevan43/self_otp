<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WhatsApp OTP API — Live Supabase Documentation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css" />
  <link rel="icon" type="image/png" href="https://supabase.com/favicon/favicon-32x32.png" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #334155;
    }
    .top-header {
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      color: #ffffff;
      padding: 20px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    }
    .header-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .header-meta {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .badge {
      background: rgba(255, 255, 255, 0.2);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
    }
    .badge-live {
      background: #047857;
      color: #a7f3d0;
      border: 1px solid #10b981;
    }
    #swagger-ui {
      max-width: 1200px;
      margin: 24px auto 48px auto;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      padding: 16px 24px;
    }
  </style>
</head>
<body>
  <div class="top-header">
    <div class="header-title">⚡ WhatsApp OTP API Platform — Live Documentation</div>
    <div class="header-meta">
      <span class="badge badge-live">● Live on Supabase Edge Functions</span>
      <span class="badge">Project: ymstmdjdgwnmtxgurhyn</span>
    </div>
  </div>

  <div id="swagger-ui"></div>

  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    window.onload = function() {
      const ui = SwaggerUIBundle({
        url: "https://ymstmdjdgwnmtxgurhyn.supabase.co/functions/v1/otp/openapi.json",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIBundle.SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout",
        onComplete: function() {
          // Pre-populate demo API key for instant testing
          ui.preauthorizeApiKey("ApiKeyAuth", "wotp_live_demo_secret_key_1234567890abcdef");
        }
      });
      window.ui = ui;
    };
  </script>
</body>
</html>
