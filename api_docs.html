<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Meta WhatsApp OTP API SaaS — Live Swagger UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css" />
  <link rel="icon" type="image/png" href="https://supabase.com/favicon/favicon-32x32.png" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0b0f19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .top-header {
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      color: #ffffff;
      padding: 18px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }
    .header-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .header-meta {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .badge {
      background: rgba(255, 255, 255, 0.2);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
    }
    .badge-live {
      background: #047857;
      color: #a7f3d0;
      border: 1px solid #10b981;
    }
    #swagger-ui {
      max-width: 1320px;
      margin: 24px auto 60px auto;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      padding: 16px 28px;
    }
    .swagger-ui .topbar { display: none; }
  </style>
</head>
<body>
  <div class="top-header">
    <div class="header-title">⚡ Meta WhatsApp OTP API SaaS Platform — Full API Reference</div>
    <div class="header-meta">
      <span class="badge badge-live">● Live on Supabase Edge Functions</span>
      <span class="badge">Project: ymstmdjdgwnmtxgurhyn</span>
    </div>
  </div>

  <div id="swagger-ui"></div>

  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    window.onload = function() {
      const ui = SwaggerUIBundle({
        url: "/docs/json",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIBundle.SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout"
      });
      window.ui = ui;
    };
  </script>
</body>
</html>
